name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  boxlang:
    name: BoxLang snapshot / Java 21
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up BoxLang snapshot and CommandBox
        uses: ortus-boxlang/setup-boxlang@1.4.0
        with:
          version: snapshot
          with-commandbox: true
          commandbox_version: 6.3.1

      - name: Install dependencies
        run: box install

      - name: Show runtime versions
        run: |
          java -version
          boxlang --version

      - name: Run tests with BoxLang
        run: box run-script test

      - name: Verify test result
        shell: bash
        run: |
          if ! grep -qx 'test.passed=true' tests/results/TEST.properties; then
            echo '::error::TestBox reported failures or errors.'
            exit 1
          fi

  lucee:
    name: Lucee 5.4 / Java 11
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"

      - name: Set up CommandBox
        uses: Ortus-Solutions/setup-commandbox@v2.0.1
        with:
          version: 6.3.1
          install: testbox-cli

      - name: Install dependencies
        run: box install

      - name: Show runtime versions
        run: |
          java -version
          box version

      - name: Start Lucee
        run: >-
          box server start
          cfengine="lucee@5.4.8+2"
          name=socketbox-ci-lucee
          host=127.0.0.1
          port=8599
          openbrowser=false
          trayEnable=false
          saveSettings=false

      - name: Run tests with Lucee
        run: >-
          box testbox run
          runner=http://127.0.0.1:8599/tests/runner.cfm
          directory=tests.specs
          reporter=json
          verbose=true

      - name: Verify test result
        shell: bash
        run: |
          if ! grep -qx 'test.passed=true' tests/results/TEST.properties; then
            echo '::error::TestBox reported failures or errors.'
            exit 1
          fi

      - name: Stop Lucee
        if: always()
        run: box server stop socketbox-ci-lucee
